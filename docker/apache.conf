# 2026-11-25 — зеркало оплаты СБП: :80 за nginx на хосте, :443 с самоподписанным сертификатом для локальной проверки
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

AddType font/woff2 .woff2
AddType image/svg+xml .svg

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
    # Всё, кроме файлов из assets/, обрабатывает index.php
    FallbackResource /index.php
</Directory>

# Своя статика страницы. CSS и JS подключаются с ?v=<время изменения>, поэтому кэш долгий.
<Directory /var/www/html/assets>
    Header set Cache-Control "public, max-age=604800"
    Header set X-Content-Type-Options "nosniff"
</Directory>

<VirtualHost *:80>
    DocumentRoot /var/www/html
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/ssl/mirror/selfsigned.crt
    SSLCertificateKeyFile /etc/ssl/mirror/selfsigned.key
</VirtualHost>
