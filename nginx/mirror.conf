# Общая часть server, подключается из plain.conf.template и tls.conf.template.

# DNS Docker: после пересоздания контейнера у зеркала новый адрес, nginx подхватит его без перезапуска.
resolver 127.0.0.11 valid=10s ipv6=off;
set $mirror http://mirror:80;

client_max_body_size 64k;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $mirror_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Логотипов и шрифтов на одну страницу до двух сотен, под лимит запросов они не попадают.
location ~ ^/(?:nspk/)?(?:assets|logo|proxyapp/logo|proxyapp/uniqr|static|woff2)/ {
    proxy_pass $mirror;
}

location = /_mirror/health {
    access_log off;
    proxy_pass $mirror;
}

location / {
    limit_req zone=mirror burst=60 nodelay;
    proxy_pass $mirror;
}
