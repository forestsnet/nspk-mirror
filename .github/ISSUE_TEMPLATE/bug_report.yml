name: Ошибка
description: Зеркало работает не так, как описано в документации
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что ожидали и что получили вместо этого.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Открыть https://sbp.example.com/<QRC_ID> на iPhone
        2. Нажать на банк
        3. …
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим развёртывания
      options:
        - HTTPS с Let's Encrypt (docker-compose.tls.yml)
        - Только HTTP за внешним TLS (docker-compose.yml)
        - За nginx хоста (docker-compose.host.yml)
        - Локально (docker-compose.dev.yml)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и браузер
      placeholder: iPhone 15, Safari 18 · Android 14, Chrome 142
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `git log -1 --oneline`.
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: Вывод `docker compose logs --tail=100 mirror nginx`.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: В тексте и логах нет живых ссылок на оплату, ключей и содержимого `.env`
          required: true
