name: Предложение
description: Новая возможность или улучшение
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает
      description: Что сейчас неудобно или невозможно.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Как это может выглядеть
      description: Поведение страницы, новые параметры, маршруты или переменные окружения.
  - type: textarea
    id: alternatives
    attributes:
      label: Что пробовали вместо этого
