name: nspk-mirror

services:
  mirror:
    build: .
    image: nspk-mirror:latest
    container_name: nspk-mirror
    restart: unless-stopped
    environment:
      MIRROR_ORIGIN: ${MIRROR_ORIGIN:-}
    volumes:
      - cache:/var/cache/nspk-mirror
    networks:
      - internal

  nginx:
    image: nginx:1.30-alpine
    container_name: nspk-mirror-nginx
    restart: unless-stopped
    depends_on:
      mirror:
        condition: service_healthy
    environment:
      MIRROR_DOMAIN: ${MIRROR_DOMAIN:-_}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/plain.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/mirror.conf:/etc/nginx/snippets/mirror.conf:ro
      - acme:/var/www/acme:ro
    networks:
      - internal

  certbot:
    image: certbot/certbot:v5.10.0
    profiles:
      - certbot
    volumes:
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt
      - acme:/var/www/acme

networks:
  internal:

volumes:
  cache:
  acme:
